<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BLEBridge Narodmon Payload</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body data-page="narodmon">
    <main>
        <div data-app-header data-title="Narodmon Payload"></div>

        <section class="card">
            <pre id="narodmon-payload" class="payload-view">Loading...</pre>
        </section>
    </main>

    <script src="/app.js"></script>
    <script>
        async function loadNarodmonPayload() {
            const payload = document.getElementById('narodmon-payload');

            try {
                const response = await fetch('/narodmon.ssi', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const text = await response.text();
                payload.textContent = text.endsWith('\n') ? text.slice(0, -1) : text;
            } catch (error) {
                payload.textContent = 'Failed to load Narodmon payload';
            }
        }

        App.initHeader();
        loadNarodmonPayload();
    </script>
</body>
</html>
