<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BLEBridge Settings</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body data-page="settings">
    <main class="narrow">
        <div data-app-header data-title="Settings"></div>

        <section class="card">
            <p class="muted">Changes are written to <code>config.ini</code>.</p>
            <p id="save-status" class="muted">Loading settings...</p>
            <form id="settings-form">
                <label>
                    Mode
                    <select name="mode" id="mode">
                        <option value="ap">Access Point</option>
                        <option value="client">Client</option>
                    </select>
                </label>

                <label>
                    SSID
                    <input type="text" name="ssid" id="ssid" maxlength="32">
                </label>

                <label>
                    Host Name
                    <input type="text" name="hostname" id="hostname" maxlength="63">
                </label>

                <label>
                    Channel
                    <input type="number" name="channel" id="channel" min="1" max="13">
                </label>

                <label>
                    Security
                    <select name="security" id="security">
                        <option value="open">Open</option>
                        <option value="wpa2">WPA2</option>
                    </select>
                </label>

                <label>
                    Password
                    <input type="text" name="password" id="password" maxlength="64">
                </label>

                <label class="inline-check">
                    <input type="checkbox" name="send_narodmon" id="send_narodmon">
                    Send data to narodmon.ru every 5 minutes
                </label>

                <label>
                    Measurement Retention (s)
                    <input type="number" name="measurement_retention_seconds" id="measurement_retention_seconds" min="5" max="600">
                </label>

                <label>
                    Max Measurements per Sensor Field
                    <input type="number" name="measurement_max_count" id="measurement_max_count" min="0" max="1000">
                </label>

                <div class="button-row">
                    <button type="submit" name="reboot" value="0">Save</button>
                    <button type="submit" name="reboot" value="1" class="secondary">Save and Reboot</button>
                </div>
            </form>
        </section>

        <section class="card">
            <div class="section-title">
                <h2>Firmware Update</h2>
            </div>
            <p class="muted">Current build: <span id="firmware-build">Loading...</span></p>
            <p id="update-status" class="muted">Select a <code>.ota</code> file.</p>
            <form id="update-form">
                <label>
                    OTA File
                    <input type="file" id="ota-file" accept=".ota">
                </label>

                <div class="button-row">
                    <button type="submit">Update</button>
                </div>
            </form>
        </section>
    </main>

    <script src="/app.js"></script>
    <script>
        async function loadConfig() {
            const response = await fetch('/config.json', { cache: 'no-store' });
            const config = await response.json();

            document.getElementById('mode').value = config.mode || 'ap';
            document.getElementById('ssid').value = config.ssid || '';
            document.getElementById('hostname').value = config.hostname || '';
            document.getElementById('channel').value = config.channel || 3;
            document.getElementById('security').value = config.security || 'open';
            document.getElementById('password').value = config.password || '';
            document.getElementById('send_narodmon').checked = !!config.send_narodmon;
            document.getElementById('measurement_retention_seconds').value = config.measurement_retention_seconds || 300;
            document.getElementById('measurement_max_count').value = config.measurement_max_count || 0;
            document.getElementById('firmware-build').textContent =
                `#${config.build_number || 0}, ${config.build_datetime || 'unknown'}`;
            document.getElementById('save-status').textContent = config.save_status_valid
                ? config.save_status
                : 'Ready';
        }

        document.getElementById('settings-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const submitter = event.submitter;
            const form = new FormData(event.target);
            const params = new URLSearchParams(form);
            const status = document.getElementById('save-status');

            if (submitter && submitter.name) {
                params.set(submitter.name, submitter.value);
            }

            status.textContent = params.get('reboot') === '1' ? 'Saving and rebooting...' : 'Saving...';
            try {
                await fetch(`/apply.cgi?${params.toString()}`, { cache: 'no-store' });
                await loadConfig();
            } catch (error) {
                status.textContent = 'Save failed';
            }
        });

        document.getElementById('update-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const fileInput = document.getElementById('ota-file');
            const status = document.getElementById('update-status');
            const file = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;

            if (!file) {
                status.textContent = 'Select a .ota file';
                return;
            }

            if (!file.name.toLowerCase().endsWith('.ota')) {
                status.textContent = 'Invalid file extension';
                return;
            }

            status.textContent = 'Uploading firmware...';
            try {
                const chunkSize = 4096;
                for (let offset = 0; offset < file.size; offset += chunkSize) {
                    const chunk = file.slice(offset, Math.min(offset + chunkSize, file.size));
                    const response = await fetch(`/update?offset=${offset}&total=${file.size}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/octet-stream'
                        },
                        body: chunk,
                        cache: 'no-store'
                    });
                    await response.text();

                    const progress = Math.min(100, Math.floor(((offset + chunk.size) * 100) / file.size));
                    status.textContent = `Uploading firmware... ${progress}%`;

                    const configResponse = await fetch('/config.json', { cache: 'no-store' });
                    const config = await configResponse.json();
                    if (config.save_status_valid && config.save_status.startsWith('Update failed')) {
                        document.getElementById('save-status').textContent = config.save_status;
                        status.textContent = config.save_status;
                        return;
                    }
                }

                await loadConfig();
                status.textContent = document.getElementById('save-status').textContent;
            } catch (error) {
                status.textContent = 'Firmware upload failed';
            }
        });

        App.initHeader();
        loadConfig().catch(() => {
            document.getElementById('save-status').textContent = 'Failed to load settings';
        });
    </script>
</body>
</html>
